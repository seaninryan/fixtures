name: deploy

on:
  push:
    branches: [main]
  # A push made with GITHUB_TOKEN never triggers another workflow, so the daily
  # snapshot commit from `check` would otherwise leave the site serving yesterday's
  # JSON forever - public/data is copied into dist at BUILD time, so new data needs
  # a new build. workflow_run fires whoever pushed. It also fires on runs that
  # changed nothing, which is a cheap no-op rebuild rather than a problem.
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Never publish off a check run that aborted: a failed fetch means no snapshot.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
