<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Craughwell United Fixtures</title>
    <!-- Tab icon: the calendar emoji drawn by the browser's own emoji font, inline, so
         it costs no request. Apple ignores SVG icons for a home-screen shortcut, so
         apple-touch-icon.png is a 180x180 render of the same emoji on the site's card
         colour. That href carries the Vite `base` (/fixtures/) explicitly - a bare
         /apple-touch-icon.png would 404 on Pages. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%85</text></svg>" />
    <link rel="apple-touch-icon" href="/fixtures/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1419" />
    <!-- Fonts for the social cards (src/lib/cardLayout.js). The canvas draws with them,
         so the Graphics tab waits on document.fonts before measuring or drawing. Mulish
         stands in for Canva Sans, which cannot be embedded outside Canva. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Mulish:wght@400;700&display=swap" />
    <!-- Google Identity Services, for the owner gate in src/lib/owner.js. Loaded async:
         the app polls for window.google and shows the sign-in button either way, so a
         blocked script degrades to "cannot sign in" rather than to a blank page. -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
