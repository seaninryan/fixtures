<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Craughwell United Fixtures</title>
    <!-- Tab icon: the calendar emoji drawn by the browser's own emoji font, inline, so
         it costs no request. Apple ignores SVG icons for a home-screen shortcut, so
         apple-touch-icon.png is a 180x180 render of the same emoji on the site's card
         colour. That href carries the Vite `base` (/fixtures/) explicitly - a bare
         /apple-touch-icon.png would 404 on Pages. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%85</text></svg>" />
    <link rel="apple-touch-icon" href="/fixtures/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1419" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
